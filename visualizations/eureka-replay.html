<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eureka EEG Wave Visualizer</title>
  <style>
    :root { color-scheme:dark; --bg:#10141a; --panel:#171e27; --line:#344254; --text:#f5f7fb; --muted:#9eabba; --theta:#bba1ff; --alpha:#8fe0c0; --beta:#7db8ff; --warn:#f2ba71; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:28px 20px 42px; }
    h1,h2,p { margin:0; } h1 { font-size:28px; letter-spacing:-.02em; } h2 { font-size:16px; font-weight:600; }
    .subhead,.meta { color:var(--muted); } .subhead { margin-top:4px; } .meta { font-size:12px; margin-top:10px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .controls { display:flex; gap:12px; flex-wrap:wrap; align-items:end; margin:22px 0 18px; }
    label { color:var(--muted); font-size:12px; display:grid; gap:5px; }
    select,input[type="file"] { max-width:290px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:7px; font:inherit; padding:8px 10px; }
    input[type="file"] { padding:6px; }
    .band-controls { display:flex; flex-wrap:wrap; gap:14px; margin-top:13px; }
    .band-controls label { display:flex; grid-template-columns:auto auto; align-items:center; gap:6px; font-size:13px; }
    .band-controls input { accent-color:var(--alpha); }
    .swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
    canvas { width:100%; height:500px; display:block; margin-top:14px; border-radius:8px; background:#0d1218; }
    .notice { min-height:22px; color:var(--muted); margin-top:12px; }
    .notice.error { color:var(--warn); }
    .legend { display:flex; flex-wrap:wrap; gap:14px; color:var(--muted); font-size:12px; margin-top:10px; }
    @media (max-width:640px) { main { padding:20px 14px 32px; } canvas { height:390px; } }
  </style>
</head>
<body>
  <main>
    <h1>Eureka EEG wave visualizer</h1>
    <p class="subhead">Inspect the full recording at once. This tool visualizes filtered signals; it does not score creativity or recommend an activity.</p>

    <section class="panel" style="margin-top:22px">
      <div class="controls">
        <label>Included recording <select id="recording"></select></label>
        <label>Upload a CSV <input id="upload" type="file" accept=".csv,text/csv"></label>
        <label>EEG channel <select id="channel"></select></label>
      </div>
      <div class="band-controls" role="group" aria-label="Visible frequency bands">
        <label><input type="checkbox" data-band="theta" checked><span><i class="swatch" style="background:#bba1ff"></i>Theta · 4–8 Hz</span></label>
        <label><input type="checkbox" data-band="alpha" checked><span><i class="swatch" style="background:#8fe0c0"></i>Alpha · 8–12 Hz</span></label>
        <label><input type="checkbox" data-band="beta" checked><span><i class="swatch" style="background:#7db8ff"></i>Beta · 13–30 Hz</span></label>
      </div>
      <canvas id="waveform" aria-label="Full recording EEG waveform view"></canvas>
      <div class="legend"><span><i class="swatch" style="background:#bba1ff"></i>Theta</span><span><i class="swatch" style="background:#8fe0c0"></i>Alpha</span><span><i class="swatch" style="background:#7db8ff"></i>Beta</span></div>
      <p class="meta" id="recording-info"></p>
      <p class="notice" id="notice">All three filtered bands are visible. Uncheck two bands to inspect one wave alone.</p>
    </section>
  </main>
  <script src="./eureka-replay-data.js"></script>
  <script>
    (() => {
      const bundled = window.EUREKA_REPLAY_DATA;
      const bandColors = {theta:'#bba1ff', alpha:'#8fe0c0', beta:'#7db8ff'};
      const bandNames = {theta:'Theta · 4–8 Hz', alpha:'Alpha · 8–12 Hz', beta:'Beta · 13–30 Hz'};
      const bandBounds = {theta:[4,8], alpha:[8,12], beta:[13,30]};
      const recordingSelect = document.getElementById('recording');
      const channelSelect = document.getElementById('channel');
      const upload = document.getElementById('upload');
      const canvas = document.getElementById('waveform');
      const info = document.getElementById('recording-info');
      const notice = document.getElementById('notice');
      const visibleBands = new Set(['theta','alpha','beta']);

      function labelFor(session) { return session.display_name || session.scenario.replaceAll('_',' '); }
      const included = bundled.sessions.map(session => ({
        id:session.scenario,
        name:labelFor(session),
        channels:bundled.channels,
        sampleRate:bundled.waveform_sample_rate_hz,
        duration:session.duration_seconds,
        bands:session.waveforms_by_band,
        yLimit:session.waveform_y_limit_uv,
        source:'Included recording'
      }));
      let active = included.find(item => item.id === 'real_trial_for_training') || included[0];
      let channelIndex = 1;

      included.forEach((item,index) => recordingSelect.add(new Option(item.name,index)));
      recordingSelect.value = String(included.indexOf(active));

      function resetChannels() {
        channelSelect.innerHTML = '';
        active.channels.forEach((channel,index) => channelSelect.add(new Option(channel,index)));
        channelIndex = Math.min(channelIndex, active.channels.length - 1);
        channelSelect.value = String(channelIndex);
      }

      function canvasContext() {
        const dpr = devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr); canvas.height = Math.round(rect.height * dpr);
        const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
        return [ctx,rect.width,rect.height];
      }
      function text(ctx,value,x,y,align='left') { ctx.fillStyle='#9eabba';ctx.font='12px ui-sans-serif,system-ui';ctx.textAlign=align;ctx.fillText(value,x,y); }
      function frame(ctx,w,h,m) { ctx.strokeStyle='#344254';ctx.lineWidth=1;ctx.strokeRect(m.l,m.t,w-m.l-m.r,h-m.t-m.b); }
      function formatSeconds(seconds) { return seconds < 60 ? `${seconds.toFixed(1)} s` : `${Math.floor(seconds/60)}m ${(seconds%60).toFixed(0)}s`; }

      // Compress each trace into min/max columns so an entire long recording remains visible.
      function drawCompressedTrace(ctx,values,color,x,y,width) {
        const columns = Math.max(1,Math.floor(width));
        ctx.beginPath();
        for(let column=0;column<columns;column++) {
          const start=Math.floor(column*values.length/columns), end=Math.max(start+1,Math.floor((column+1)*values.length/columns));
          let low=Infinity,high=-Infinity;
          for(let i=start;i<end;i++) { const value=values[i]; if(value<low)low=value; if(value>high)high=value; }
          const px=x+column+.5;
          ctx.moveTo(px,y(low));ctx.lineTo(px,y(high));
        }
        ctx.strokeStyle=color;ctx.lineWidth=1;ctx.globalAlpha=.82;ctx.stroke();ctx.globalAlpha=1;
      }

      function render() {
        const [ctx,w,h] = canvasContext(), m={l:55,r:18,t:20,b:34};
        const max=Math.max(1,active.yLimit), x=time => m.l+(w-m.l-m.r)*time/Math.max(active.duration,.001), y=value => m.t+(h-m.t-m.b)*(max-value)/(2*max);
        ctx.clearRect(0,0,w,h);
        ctx.strokeStyle='#344254';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(m.l,y(0));ctx.lineTo(w-m.r,y(0));ctx.stroke();ctx.setLineDash([]);
        for(const band of visibleBands) drawCompressedTrace(ctx,active.bands[band][channelIndex],bandColors[band],m.l,y,w-m.l-m.r);
        frame(ctx,w,h,m);
        [-max,0,max].forEach(value=>text(ctx,`${Math.round(value)} µV`,m.l-8,y(value)+4,'right'));
        [0,.25,.5,.75,1].forEach(fraction=>{const seconds=active.duration*fraction;text(ctx,formatSeconds(seconds),x(seconds),h-10,'center');});
        const visible = [...visibleBands].map(band=>bandNames[band]).join(' · ');
        info.textContent=`${active.name} · ${active.source} · ${active.channels[channelIndex]} · ${formatSeconds(active.duration)} · ${Math.round(active.sampleRate)} Hz display sample rate · fixed ±${Math.round(max)} µV scale across channels and bands.`;
        notice.className='notice';
        notice.textContent=visible ? `Showing ${visible}. Uncheck bands to isolate a single filtered wave.` : 'Select at least one frequency band to draw a trace.';
      }

      function median(values) { const sorted=[...values].sort((a,b)=>a-b); return sorted[Math.floor(sorted.length/2)] || 0; }
      function downsampleStride(sourceRate,targetRate=125) { return Math.max(1,Math.round(sourceRate/targetRate)); }
      function downsample(values,sourceRate,targetRate=125) { const stride=downsampleStride(sourceRate,targetRate); return values.filter((_,index)=>index%stride===0); }
      function biquadPass(values,low,high,sampleRate) {
        const center=Math.sqrt(low*high), q=center/(high-low), omega=2*Math.PI*center/sampleRate, alpha=Math.sin(omega)/(2*q), cosine=Math.cos(omega);
        const b0=alpha/(1+alpha), b2=-alpha/(1+alpha), a1=(-2*cosine)/(1+alpha), a2=(1-alpha)/(1+alpha);
        let x1=0,x2=0,y1=0,y2=0;
        return values.map(x=>{const y=b0*x+b2*x2-a1*y1-a2*y2;x2=x1;x1=x;y2=y1;y1=y;return y;});
      }
      function zeroPhaseBandpass(values,bounds,sampleRate) {
        let output=values;
        for(let pass=0;pass<2;pass++) { output=biquadPass(output,bounds[0],bounds[1],sampleRate); output=biquadPass([...output].reverse(),bounds[0],bounds[1],sampleRate).reverse(); }
        return output;
      }
      function percentileLimit(bands) {
        const values=[];
        Object.values(bands).forEach(channels=>channels.forEach(channel=>channel.forEach(value=>values.push(Math.abs(value)))));
        values.sort((a,b)=>a-b); return Math.max(1,Math.ceil((values[Math.floor(values.length*.995)] || 1)/5)*5);
      }
      function parseCsv(text) {
        const rows=text.trim().split(/\r?\n/).filter(Boolean).map(row=>row.split(','));
        if(rows.length<3) throw new Error('The CSV needs a header and at least two data rows.');
        const headers=rows[0].map(header=>header.trim().replace(/^\uFEFF/,''));
        const timestampIndex=headers.findIndex(header=>/^(timestamp|timestamps|time)$/i.test(header));
        const channelIndexes=headers.map((header,index)=>({header,index})).filter(({header,index})=>index!==timestampIndex&&!/^(right aux|aux)$/i.test(header));
        if(!channelIndexes.length) throw new Error('No EEG columns found. Include numeric channels such as TP9, AF7, AF8, or TP10.');
        const channels=channelIndexes.map(item=>item.header), raw=channels.map(()=>[]), times=[];
        rows.slice(1).forEach(row=>{const values=channelIndexes.map(({index})=>Number(row[index]));if(values.some(value=>!Number.isFinite(value)))return;raw.forEach((channel,index)=>channel.push(values[index]));if(timestampIndex>=0)times.push(Number(row[timestampIndex]));});
        if(raw[0].length<20) throw new Error('The CSV does not contain enough numeric EEG samples.');
        const deltas=[]; for(let index=1;index<times.length;index++){const delta=times[index]-times[index-1];if(Number.isFinite(delta)&&delta>0)deltas.push(delta);}
        const inferred=median(deltas); const sampleRate=inferred>0 ? Math.round(1/inferred) : 250;
        if(!Number.isFinite(sampleRate)||sampleRate<20||sampleRate>2000) throw new Error('Could not infer a usable sample rate from timestamps.');
        const bands={theta:[],alpha:[],beta:[]};
        raw.forEach(channel=>Object.entries(bandBounds).forEach(([band,bounds])=>bands[band].push(downsample(zeroPhaseBandpass(channel,bounds,sampleRate),sampleRate))));
        return {name:'Uploaded CSV',source:'Uploaded file',channels,sampleRate:sampleRate/downsampleStride(sampleRate),duration:(raw[0].length-1)/sampleRate,bands,yLimit:percentileLimit(bands)};
      }

      recordingSelect.addEventListener('change',()=>{active=included[Number(recordingSelect.value)];resetChannels();render();});
      channelSelect.addEventListener('change',()=>{channelIndex=Number(channelSelect.value);render();});
      document.querySelectorAll('[data-band]').forEach(input=>input.addEventListener('change',()=>{input.checked?visibleBands.add(input.dataset.band):visibleBands.delete(input.dataset.band);render();}));
      upload.addEventListener('change',async()=>{const file=upload.files[0];if(!file)return;notice.className='notice';notice.textContent=`Filtering ${file.name}…`;try{await new Promise(requestAnimationFrame);active=parseCsv(await file.text());recordingSelect.value='';resetChannels();render();}catch(error){notice.className='notice error';notice.textContent=`Could not load ${file.name}: ${error.message}`;}});
      resetChannels();render();addEventListener('resize',render);
    })();
  </script>
</body>
</html>
